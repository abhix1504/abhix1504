<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 150"
     width="1200"
     height="150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="35%" stop-color="#EC4899"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <filter id="nameGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bracket {
      fill: #4B5563;
      font-family: "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 30px;
      font-weight: bold;
    }
    .name {
      fill: url(#nameGradient);
      font-family: "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 4px;
      text-anchor: middle;
      filter: url(#nameGlow);
    }
    .prompt {
      fill: #86EFAC;
      font-family: "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 20px;
      font-weight: bold;
      text-anchor: middle;
    }
  </style>

  <rect x="20" y="20" width="1160" height="2" fill="url(#nameGradient)" opacity="0.5"/>
  <text x="600" y="85" class="name">ABHIGYAN BHATNAGAR</text>
  <text x="600" y="125" class="prompt">&lt; full-stack dev :: ml &amp; cloud explorer /&gt;</text>
  <rect x="20" y="135" width="1160" height="2" fill="url(#nameGradient)" opacity="0.5"/>

</svg>
