<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="110" viewBox="0 0 1200 110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="fpGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="35%" stop-color="#EC4899"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      fill: url(#fpGradient);
      font-family: "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 6px;
      text-anchor: middle;
    }
    .sub {
      fill: #86EFAC;
      font-family: "DejaVu Sans Mono", "Courier New", monospace;
      font-size: 15px;
      text-anchor: middle;
    }
  </style>

  <line x1="20" y1="15" x2="1180" y2="15" stroke="url(#fpGradient)" stroke-width="2" opacity="0.5"/>
  <text x="600" y="65" class="title">FEATURED PROJECTS</text>
  <text x="600" y="95" class="sub">$ ls ./projects --sort=impact</text>

</svg>
