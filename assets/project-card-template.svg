<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="PROJECT TEMPLATE" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="themeGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="34%" stop-color="#EC4899"/>
      <stop offset="68%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="accentRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="55%" stop-color="#FACC15" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FACC15" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: "Courier New", monospace; }
      .meta { font-size:13px; font-weight:800; letter-spacing:1px; fill:#FACC15; }
      .status { font-size:11px; font-weight:800; letter-spacing:1px; fill:#86EFAC; }
      .title { font-size:28px; font-weight:900; fill:#F8FAFC; }
      .subtitle { font-size:15px; fill:#AAB2C0; }
      .category { font-size:12px; font-weight:800; letter-spacing:1px; fill:#F472B6; }
      .label { font-size:12px; font-weight:800; letter-spacing:1px; fill:#FACC15; }
      .feature { font-size:15px; font-weight:700; fill:#D7DCE5; }
      .stack { font-size:14px; font-weight:700; fill:#C084FC; }
      .repo { font-size:13px; font-weight:800; fill:#F97316; }
      .arrow { font-size:21px; font-weight:900; fill:#FACC15; }
      .footer { font-size:12px; font-weight:800; fill:#FACC15; }
    </style>
  </defs>

  <rect width="1200" height="430" fill="#0D1117"/>
  <rect x="0" y="14" width="1200" height="402" rx="14"
        fill="#07060D" stroke="url(#themeGradient)" stroke-width="2.5"/>

  <!-- EDIT_ME: project number & status (SHIPPED / IN_PROGRESS / ARCHIVED) -->
  <text x="28" y="49" class="meta">PROJECT_01</text>
  <circle cx="1045" cy="44" r="4" fill="#86EFAC"/>
  <text x="1059" y="49" class="status">SHIPPED</text>

  <rect x="28" y="67" width="1144" height="2" fill="url(#accentRule)"/>

  <!-- EDIT_ME: project title -->
  <text x="28" y="113" class="title">YOUR PROJECT NAME</text>
  <!-- EDIT_ME: one-line description -->
  <text x="28" y="143" class="subtitle">One-line description of what this project does and why it matters.</text>
  <!-- EDIT_ME: category tags -->
  <text x="28" y="175" class="category">CATEGORY • TAGS • HERE</text>

  <text x="28" y="211" class="label">FEATURES</text>
  <!-- EDIT_ME: up to 4 features -->
  <text x="38" y="244" class="feature">&gt; Feature one</text>
  <text x="38" y="282" class="feature">&gt; Feature two</text>
  <text x="38" y="320" class="feature">&gt; Feature three</text>
  <text x="38" y="358" class="feature">&gt; Feature four</text>

  <text x="544" y="211" class="label">STACK</text>
  <!-- EDIT_ME: tech stack used -->
  <text x="544" y="248" class="stack">Language  •  Framework  •  Tool</text>

  <rect x="544" y="279" width="578" height="1" fill="#242938"/>
  <text x="544" y="315" class="label">REPOSITORY</text>
  <!-- EDIT_ME: repo link -->
  <text x="544" y="350" class="repo">github.com/abhix1504/your-repo</text>
  <text x="1130" y="350" class="arrow">↗</text>

  <rect x="28" y="382" width="1144" height="1" fill="#242938"/>
  <text x="28" y="404" class="footer">MODULE STATUS: LOADED ✓</text>
</svg>
