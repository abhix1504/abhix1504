<svg width="100%" height="120" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="120" fill="url(#headerGrad)"/>
  
  <!-- Decorative left line -->
  <line x1="0" y1="60" x2="80" y2="60" stroke="#A970FF" stroke-width="3" opacity="0.6"/>
  
  <!-- Main text -->
  <text x="150" y="75" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#A970FF" filter="url(#glow)">
    GitHub Stats
  </text>
  
  <!-- Decorative right line -->
  <line x1="650" y1="60" x2="1200" y2="60" stroke="#A970FF" stroke-width="3" opacity="0.6"/>
  
  <!-- Subtle decoration dots -->
  <circle cx="100" cy="30" r="4" fill="#A970FF" opacity="0.4"/>
  <circle cx="120" cy="40" r="3" fill="#A970FF" opacity="0.3"/>
  <circle cx="1100" cy="35" r="4" fill="#A970FF" opacity="0.4"/>
  <circle cx="1080" cy="45" r="3" fill="#A970FF" opacity="0.3"/>
</svg>
