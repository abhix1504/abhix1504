<svg viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ghsTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="55%" stop-color="#A970FF"/>
      <stop offset="100%" stop-color="#D9A9FF"/>
    </linearGradient>
    <linearGradient id="ghsLineGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#A970FF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ghsLineGradR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A970FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="200" fill="#0D1117"/>

  <!-- diamond ornament -->
  <rect x="592" y="28" width="16" height="16" fill="#A970FF" opacity="0.9" transform="rotate(45 600 36)"/>

  <!-- flanking rules -->
  <line x1="60" y1="104" x2="470" y2="104" stroke="url(#ghsLineGradL)" stroke-width="2"/>
  <line x1="730" y1="104" x2="1140" y2="104" stroke="url(#ghsLineGradR)" stroke-width="2"/>

  <!-- small tick marks near the rules, echoing the divider dots elsewhere in the profile -->
  <circle cx="495" cy="96" r="3" fill="#A970FF" opacity="0.8"/>
  <circle cx="705" cy="112" r="3" fill="#A970FF" opacity="0.6"/>

  <!-- title -->
  <text x="600" y="118" text-anchor="middle"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-weight="700" font-size="46" letter-spacing="4"
        fill="url(#ghsTitleGrad)">GITHUB STATS</text>

  <!-- terminal-style subtitle -->
  <text x="600" y="156" text-anchor="middle"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-size="16" fill="#6E7681">$ git log --author=abhix1504 --stat --live</text>
</svg>
