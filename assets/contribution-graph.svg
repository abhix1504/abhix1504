<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A970FF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A970FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="12" fill="#0D1117" stroke="#A970FF" stroke-width="2"/>

  <text x="30" y="38" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="bold" fill="#A970FF">CONTRIBUTION ACTIVITY</text>
  <text x="30" y="58" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#8B949E">commits over the last 12 months</text>

  <!-- gridlines -->
  <g stroke="#21262D" stroke-width="1">
    <line x1="60" y1="90" x2="1160" y2="90"/>
    <line x1="60" y1="140" x2="1160" y2="140"/>
    <line x1="60" y1="190" x2="1160" y2="190"/>
    <line x1="60" y1="240" x2="1160" y2="240"/>
    <line x1="60" y1="270" x2="1160" y2="270"/>
  </g>

  <!-- area + line (illustrative shape) -->
  <path d="M60,240 L155,210 L250,225 L345,150 L440,190 L535,120 L630,160 L725,95 L820,175 L915,110 L1010,200 L1105,140 L1160,165 L1160,270 L60,270 Z" fill="url(#areaFill)"/>
  <polyline points="60,240 155,210 250,225 345,150 440,190 535,120 630,160 725,95 820,175 915,110 1010,200 1105,140 1160,165" fill="none" stroke="#A970FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- points -->
  <g fill="#FFFFFF">
    <circle cx="155" cy="210" r="3.5"/>
    <circle cx="345" cy="150" r="3.5"/>
    <circle cx="535" cy="120" r="3.5"/>
    <circle cx="725" cy="95" r="3.5"/>
    <circle cx="915" cy="110" r="3.5"/>
    <circle cx="1105" cy="140" r="3.5"/>
  </g>

  <!-- month labels -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#8B949E" text-anchor="middle">
    <text x="60" y="296">Oct</text>
    <text x="155" y="296">Nov</text>
    <text x="250" y="296">Dec</text>
    <text x="345" y="296">Jan</text>
    <text x="440" y="296">Feb</text>
    <text x="535" y="296">Mar</text>
    <text x="630" y="296">Apr</text>
    <text x="725" y="296">May</text>
    <text x="820" y="296">Jun</text>
    <text x="915" y="296">Jul</text>
    <text x="1010" y="296">Aug</text>
    <text x="1105" y="296">Sep</text>
  </g>
</svg>
