<svg width="100%" height="100" viewBox="0 0 1200 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&display=swap');
    </style>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C4DFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="100" fill="#0D1117" opacity="0.8"/>
  
  <!-- Main header text with gradient -->
  <text x="600" y="60" font-family="'Courier Prime', monospace" font-size="52" font-weight="bold" fill="url(#textGradient)" text-anchor="middle" filter="url(#glow)" letter-spacing="2">
    GITHUB   STATS
  </text>
  
  <!-- Command line text -->
  <text x="600" y="88" font-family="'Courier Prime', monospace" font-size="12" fill="#00FF00" text-anchor="middle" opacity="0.8">
    $ git log --all --stat --author=abhix1504
  </text>
</svg>
